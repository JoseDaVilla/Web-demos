# Publishes the built demo pages (<slug>/index.html) to GitHub Pages on every
# push to main. Pages are built locally with build/build.py and committed, so
# this workflow only uploads files; it never needs the source photos.
name: Publish demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html _site/ 2>/dev/null || true
          for d in */; do
            d="${d%/}"
            if [ "$d" != "_site" ] && [ -f "$d/index.html" ]; then
              cp -r "$d" _site/
            fi
          done
          touch _site/.nojekyll
          ls -R _site | head -50
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
